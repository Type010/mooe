name: Generate Snake

on:
  schedule:
    # 每天 UTC 20:00（北京时间次日 04:00）更新一次贡献图
    - cron: "0 20 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Type010
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # 生成结果推送到 snake 分支，博客首页通过 jsDelivr 引用：
      # https://cdn.jsdelivr.net/gh/Type010/mooe@snake/github-snake.svg
      - name: Push to snake branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: snake
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
